# Test Configuration for Multi-Strategy Prompting with 20 GSM8K samples
# Tests the new XML-based multi-strategy exploration format
# Enables semantic diversity reward using sentence embeddings

training:
  # Small dataset for testing
  dataset: "gsm8k"
  num_samples: 20
  train_split: 0.8  # 16 for training
  val_split: 0.1    # 2 for validation
  test_split: 0.1   # 2 for testing

  # Single epoch for quick test
  num_epochs: 1

  # Small batch for faster iteration
  batch_size: 2
  gradient_accumulation_steps: 1

  # Standard settings
  learning_rate: 1.0e-5

  # Frequent logging to see progress
  logging_steps: 1
  eval_steps: 8
  save_steps: 100

# Policy optimization - using SAPO (best for varied prompts)
policy_optimization:
  algorithm: "sapo"
  importance_sampling_level: "token"

  # Fewer traces for testing (multi-strategy generates longer outputs)
  K: 2  # Cold generation traces
  K_prime: 1  # Contexted generation traces

  # SAPO temperatures
  tau_pos: 1.0
  tau_neg: 1.05
  tau_rescue: 0.8

  # KL regularization
  beta: 0.04

# Standard reward configuration (used alongside multi-strategy rewards)
rewards:
  w_exploit_e1: 1.0
  w_explore_e1: 0.2
  w_cross_e1: 0.0

# Pairwise collaboration
collaboration:
  num_models: 2
  p_hint: 0.5
  max_context_tokens: 150  # Slightly more for multi-strategy contexts

# Multi-strategy prompting configuration (NEW)
prompting:
  # Enable multi-strategy XML format
  multi_strategy: true

  # Multi-strategy reward weights
  ms_w_correct: 2.0       # High weight for correct final answer
  ms_w_diversity: 0.5     # Semantic diversity across strategies
  ms_w_consistency: 1.5   # Bonus when strategies agree
  ms_w_format: 0.3        # XML format adherence

  # Diversity threshold for unique strategy detection
  diversity_threshold: 0.8

# Longer generation for multi-strategy format (more verbose output)
generation:
  max_new_tokens: 512  # Longer to accommodate multiple strategies
  temperature: 0.7
  top_p: 0.9
  do_sample: true
