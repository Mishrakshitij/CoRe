# Test Configuration for GRPO with 20 GSM8K samples
# Quick test to verify training and reward improvement

training:
  # Small dataset for testing
  dataset: "gsm8k"
  num_samples: 20
  train_split: 0.8  # 16 for training
  val_split: 0.1    # 2 for validation
  test_split: 0.1   # 2 for testing

  # Single epoch for quick test
  num_epochs: 1

  # Small batch for faster iteration
  batch_size: 2
  gradient_accumulation_steps: 1

  # Standard settings
  learning_rate: 1.0e-5

  # Frequent logging to see progress
  logging_steps: 1
  eval_steps: 8
  save_steps: 100

# GRPO algorithm
policy_optimization:
  algorithm: "grpo"

  # Fewer traces for faster testing
  K: 2  # Cold generation traces
  K_prime: 1  # Contexted generation traces

  # Standard GRPO settings
  beta: 0.04
  epsilon: 0.2  # Standard clipping for GRPO

# Standard reward configuration
rewards:
  w_exploit_e1: 1.0
  w_explore_e1: 0.2
  w_cross_e1: 0.0

# Pairwise collaboration
collaboration:
  num_models: 2
  p_hint: 0.5
  max_context_tokens: 120

# Faster generation for testing
generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  do_sample: true
