name: Reference implementation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and tensor test dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate paper example
        run: python -m core.cli --config configs/paper_qwen.json --data examples/train.jsonl --validate-only
      - name: Check cold scoring example
        run: python -m core.evaluation examples/predictions.jsonl --k 2
